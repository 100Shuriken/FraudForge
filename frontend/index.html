<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FraudForge — AI Fraud Defense Prototype</title>
    <meta name="description" content="Red Team / Blue Team AI-based payment fraud defense research prototype" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so a dark-mode user never
      // sees a white flash while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('fraudforge-theme');
          var legacy = { hacker: 'dark', defense: 'light' };
          var theme = legacy[stored] || stored;
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          /* private mode or storage disabled — fall through to the OS setting */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
