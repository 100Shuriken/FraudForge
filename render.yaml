# Render deploys the Python service only. Vercel continues to build the
# Next.js site from the same repository; the two are independent.
services:
  - type: web
    name: fraudforge-lab
    runtime: python
    plan: free
    rootDir: lab
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Comma-separated origins allowed to call the API, on top of the
      # localhost defaults and *.vercel.app. Set this to the production
      # domain once Vercel has assigned it.
      - key: FF_ALLOWED_ORIGINS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
